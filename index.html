<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ad Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f6f6; color: #222; }
    header { background: #111; color: #fff; padding: 16px 24px; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
.slot {
  display: flex;
  flex-wrap: wrap;        /* stack on narrow screens */
  justify-content: center;
  align-items: center;
  gap: 16px;
  max-width: 100%;
}
.slot ins {
  display: block;
  max-width: 100%;
}
.slot img {
  max-width: 100%;
  height: auto;
}
/* reserve space so content doesn't jump when the ad loads */
.slot-banner { min-height: 90px; }
.slot-rect   { min-height: 250px; }
    article { background: #fff; padding: 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <header><h1>My Demo Site</h1></header>

  <main>
    <!-- AD SLOT 1: banner (728x90) -->
    <div class="slot" id="slot-top">
<ins data-revive-zoneid="1" data-revive-id="21bbb225fe9d7c546ce6a7a6969b28f7"></ins>
<ins data-revive-zoneid="2" data-revive-id="21bbb225fe9d7c546ce6a7a6969b28f7"></ins>
    </div>

    <article>
      <h2>Sample article</h2>
      <p>This is placeholder content so you can see how the ads sit on a real page.</p>
    </article>

    <!-- AD SLOT 2: rectangle (300x250) -->
    <div class="slot" id="slot-bottom" style="min-height:250px;">
      <!-- PASTE <ins ...></ins> FOR ZONE 2 HERE -->
      <span>Ad slot 2</span>
    </div>
  </main>

  <!-- PASTE THE REVIVE SCRIPT ONCE HERE, e.g.:
  <script async src="//ads.goselr.com/www/delivery/asyncjs.php"></script>
  -->
    
  <script async src="//ads.goselr.com/www/delivery/asyncjs.php"></script>
</body>
</html>
